{% extends "base.html" %}{% block body %}
<div class="card"><h2>Issue a license</h2>{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/licenses/new"><input type="hidden" name="csrf" value="{{ csrf }}">
<p><label>User</label><select name="user_id" required>{% for u in users %}<option value="{{ u.id }}" {{ "selected" if u.id == user_id }}>{{ u.name }}</option>{% endfor %}</select></p>
<p><label>Device Code (the user copies it from ClearNAI's Profile page)</label><input name="device_code" required style="width:100%" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></p>
<p><label>Features</label>{% for f in features %}<label style="display:inline-block;margin-right:14px;color:inherit"><input type="checkbox" name="features" value="{{ f }}" checked> {{ f }}</label>{% endfor %}</p>
<p><label>Valid for (days, {{ min_days }} to {{ max_days }})</label><input name="days" type="number" value="90" min="{{ min_days }}" max="{{ max_days }}"></p>
<button>Issue</button></form></div>{% endblock %}
