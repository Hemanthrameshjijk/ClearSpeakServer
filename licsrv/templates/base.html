<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ClearNAI licenses{% endblock %}</title>
<style>
 :root{--bg:#f6f7fb;--card:#fff;--ink:#1c2233;--muted:#667;--line:#dfe3ee;--accent:#3a5bd9;--bad:#c0392b;--ok:#1e8e5a}
 @media (prefers-color-scheme: dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8ebf5;--muted:#9aa3bd;--line:#2c3350;--accent:#7b93ff;--bad:#ff7b6b;--ok:#4ad08f}}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
 nav{display:flex;gap:18px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
 nav a{color:var(--ink);text-decoration:none} nav .sp{flex:1} main{max-width:980px;margin:24px auto;padding:0 16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
 table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
 input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
 button{padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
 button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)} button.bad{background:var(--bad)}
 .muted{color:var(--muted)} .bad{color:var(--bad)} .ok{color:var(--ok)} code,textarea{font-family:ui-monospace,Consolas,monospace}
 textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
 form.inline{display:inline} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end} label{display:block;font-size:13px;color:var(--muted)}
</style></head><body>
{% if admin %}<nav><b>ClearNAI licenses</b><a href="/">Dashboard</a><a href="/users">Users</a><a href="/licenses">Licenses</a><a href="/licenses/new">Issue license</a>
{% if is_super %}<a href="/audit">Audit</a>{% endif %}<span class="sp"></span><span class="muted">{{ admin.email }}</span>
<form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="alt">Sign out</button></form></nav>{% endif %}
<main>{% block body %}{% endblock %}</main></body></html>
