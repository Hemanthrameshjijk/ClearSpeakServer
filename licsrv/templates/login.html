{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}<div class="card" style="max-width:380px;margin:60px auto"><h2>Sign in</h2>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/login"><p><label>Email</label><input name="email" type="email" required autofocus style="width:100%"></p>
<p><label>Password</label><input name="password" type="password" required style="width:100%"></p>
<p><label>Authenticator code</label><input name="totp" inputmode="numeric" autocomplete="one-time-code" required style="width:100%"></p>
<button>Sign in</button></form></div>{% endblock %}
